plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.beatlab'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexus.beatlab"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
